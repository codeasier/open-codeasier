name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Packed package smoke test
        run: |
          npm pack
          tar -tzf open-codeasier-*.tgz | sort > "$RUNNER_TEMP/package-contents"
          grep -qx 'package/dist/plugin.js' "$RUNNER_TEMP/package-contents"
          grep -qx 'package/skills/session-review/SKILL.md' "$RUNNER_TEMP/package-contents"
          grep -qx 'package/commands/session-review.md' "$RUNNER_TEMP/package-contents"
          mkdir "$RUNNER_TEMP/package-smoke"
          npm install --prefix "$RUNNER_TEMP/package-smoke" "$GITHUB_WORKSPACE"/open-codeasier-*.tgz
          (cd "$RUNNER_TEMP/package-smoke" && node --input-type=module -e "import('open-codeasier/server').then((m) => { if (!m.default.server) process.exit(1) })")
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/package-smoke/node_modules/.bin/open-codeasier" install
          test -f "$RUNNER_TEMP/home/.config/opencode/skills/session-review/SKILL.md"
          test -f "$RUNNER_TEMP/home/.config/opencode/commands/session-review.md"
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/package-smoke/node_modules/.bin/open-codeasier" uninstall
          test ! -e "$RUNNER_TEMP/home/.config/opencode/skills/session-review/SKILL.md"
          test ! -e "$RUNNER_TEMP/home/.config/opencode/commands/session-review.md"

  minimum-opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: minimum-version
        run: echo "version=$(node -p \"require('./package.json').engines.opencode.match(/\\d+\\.\\d+\\.\\d+/)[0]\")" >> "$GITHUB_OUTPUT"
      - name: OpenCode minimum-version plugin-loading smoke test
        run: |
          npm pack
          npm install --prefix "$RUNNER_TEMP/opencode-minimum" opencode-ai@"${{ steps.minimum-version.outputs.version }}" "$GITHUB_WORKSPACE"/open-codeasier-*.tgz
          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({ plugin: [require('node:url').pathToFileURL(process.argv[2]).href] }))" "$RUNNER_TEMP/opencode-minimum.json" "$RUNNER_TEMP/opencode-minimum/node_modules/open-codeasier/dist/plugin.js"
          OPENCODE_CONFIG="$RUNNER_TEMP/opencode-minimum.json" "$RUNNER_TEMP/opencode-minimum/node_modules/.bin/opencode" debug config --print-logs 2> "$RUNNER_TEMP/opencode-minimum.log"
          grep -q 'open-codeasier/dist/plugin.js' "$RUNNER_TEMP/opencode-minimum.log"
          ! grep -q 'failed to load plugin' "$RUNNER_TEMP/opencode-minimum.log"
